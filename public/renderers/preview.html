<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphics Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background: #111827;
      font-family: 'Inter', sans-serif;
    }
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .graphic-container {
      position: absolute;
      width: 100%;
      height: 100%;
    }
    #scorebug-container {
      top: 0;
      left: 0;
      z-index: 10;
    }
    #lowerthird-container {
      bottom: 0;
      left: 0;
      z-index: 8;
    }
    #ticker-container {
      bottom: 0;
      left: 0;
      z-index: 7;
    }
    #breaking-container {
      bottom: 0;
      left: 0;
      z-index: 9;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="importmap">
    {
      "imports": {
        "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.3.0/+esm"
      }
    }
  </script>
  <script type="module" src="/renderers/preview.js"></script>
</body>
</html>
